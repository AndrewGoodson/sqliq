[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "azure-sql-agents"
version = "0.1.0"
description = "AEF orchestration for approval-gated Azure SQL metadata assessment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aef-core", "cryptography>=50,<51", "pydantic>=2.12,<3"]

[project.optional-dependencies]
live = ["azure-identity>=1.25,<2", "httpx>=0.28,<1", "pyodbc>=5.3,<6"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[project.scripts]
azure-sql-agent = "azure_sql_agents.cli:main"

[tool.uv.sources]
aef-core = { path = "vendor/aef-core" }

[tool.hatch.build.targets.wheel]
packages = ["src/azure_sql_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["vendor", ".sources"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
